name: Monitoramento histórico SEFAZ

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sefaz-history-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Baixar código do Radar Fiscal
        uses: actions/checkout@v4
        with:
          ref: main
          path: source

      - name: Baixar branch de histórico persistente
        uses: actions/checkout@v4
        with:
          ref: monitor-history
          path: data
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Consultar status e registrar instabilidades
        env:
          HISTORY_FILE: ${{ github.workspace }}/data/history.json
        run: python source/.github/scripts/collect_sefaz_history.py

      - name: Persistir alterações do histórico
        working-directory: data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add history.json
          if git diff --cached --quiet; then
            echo "Nenhuma mudança a salvar."
          else
            git commit -m "Atualiza histórico de instabilidades SEFAZ"
            git push origin HEAD:monitor-history
          fi
